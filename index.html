<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>小布迪 · 出勤薪資系統</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap');
:root{
  --bg:#faf8f5;
  --white:#ffffff;
  --border:#ede8e0;
  --border2:#ddd5c8;
  --orange:#f07b3f;
  --orange-lt:#fff3ec;
  --orange-dk:#d45f25;
  --navy:#2c3566;
  --navy-lt:#eef0f8;
  --teal:#3db8b2;
  --teal-lt:#e8f7f6;
  --gray:#9a9088;
  --gray-lt:#f5f3f0;
  --red:#e05555;
  --green:#3aaa7a;
  --gold:#c8891a;
  --sans:'Noto Sans TC',sans-serif;
  --mono:'DM Mono',monospace;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--navy);font-family:var(--sans);min-height:100vh;}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;}
button{font-family:var(--sans);}
.page{display:none;}.page.active{display:block;}

/* ── HEADER ── */
.site-hdr{background:var(--white);border-bottom:3px solid var(--orange);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.logo{display:flex;align-items:center;gap:10px;}
.logo-icon{font-size:2rem;line-height:1;}
.logo-text h1{font-size:.95rem;font-weight:700;color:var(--navy);line-height:1.3;}
.logo-text p{font-size:.6rem;color:var(--gray);letter-spacing:.8px;margin-top:1px;}
.hdr-clock{font-family:var(--mono);font-size:1rem;font-weight:500;color:var(--orange);text-align:right;}
.hdr-date{font-size:.6rem;color:var(--gray);text-align:right;margin-top:2px;}

/* ── SELECT ── */
.sel-body{max-width:460px;margin:0 auto;padding:20px 16px 48px;}
.sec-label{font-size:.62rem;font-weight:700;color:var(--gray);letter-spacing:.15em;text-transform:uppercase;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid var(--border);}
.shift-pills{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.shift-pill{padding:8px 18px;border-radius:999px;border:2px solid var(--border2);background:var(--white);color:var(--gray);font-size:.8rem;font-weight:600;cursor:pointer;transition:all .14s;}
.shift-pill.early.on{background:var(--orange);border-color:var(--orange);color:#fff;}
.shift-pill.mid.on{background:var(--teal);border-color:var(--teal);color:#fff;}
.shift-pill.late2.on{background:var(--navy);border-color:var(--navy);color:#fff;}
.shift-pill:not(.on):hover{border-color:var(--orange);color:var(--orange);}
.shift-info-box{background:var(--orange-lt);border:1.5px solid var(--orange);border-radius:var(--r);padding:10px 14px;font-size:.75rem;color:var(--orange-dk);margin-bottom:18px;font-family:var(--mono);}
.teacher-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px;}
.t-btn{padding:14px 8px;border-radius:var(--r);border:1.5px solid var(--border);background:var(--white);color:var(--navy);font-size:.82rem;font-weight:600;cursor:pointer;transition:all .14s;display:flex;flex-direction:column;align-items:center;gap:5px;}
.t-btn:hover{border-color:var(--orange);background:var(--orange-lt);}
.t-btn.on{border-color:var(--green);background:#f0faf5;color:var(--green);}
.t-avatar{width:36px;height:36px;border-radius:50%;background:var(--orange-lt);color:var(--orange);display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:700;}
.t-btn.on .t-avatar{background:#d4f0e4;color:var(--green);}
.t-tag{font-size:.58rem;font-family:var(--mono);color:var(--green);}
.admin-link{text-align:center;margin-top:8px;}
.admin-link button{background:transparent;border:none;color:var(--gray);font-size:.65rem;cursor:pointer;letter-spacing:.1em;}
.admin-link button:hover{color:var(--navy);}
.fb-dot{width:7px;height:7px;border-radius:50%;background:var(--gray);display:inline-block;vertical-align:middle;margin-right:3px;transition:background .3s;}
.fb-dot.ok{background:var(--green);}

/* ── CHECKIN ── */
.ci-body{max-width:420px;margin:0 auto;padding:18px 16px 48px;}
.ci-top{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.back-btn{background:var(--white);border:1.5px solid var(--border2);border-radius:8px;color:var(--gray);font-size:.72rem;padding:6px 12px;cursor:pointer;transition:all .14s;}
.back-btn:hover{border-color:var(--navy);color:var(--navy);}
.ci-name{font-size:1rem;font-weight:700;flex:1;}
.ci-badge{font-size:.62rem;font-family:var(--mono);padding:3px 10px;border-radius:999px;border:1.5px solid;white-space:nowrap;}
.badge-in{border-color:var(--green);color:var(--green);background:#f0faf5;}
.badge-out{border-color:var(--gray);color:var(--gray);}
.shift-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font-size:.72rem;font-weight:600;margin-bottom:14px;border:1.5px solid;}
.chip-early{background:var(--orange-lt);color:var(--orange-dk);border-color:var(--orange);}
.chip-mid{background:var(--teal-lt);color:var(--teal);border-color:var(--teal);}
.chip-late2{background:var(--navy-lt);color:var(--navy);border-color:var(--navy);}
.bal-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.bal-chip{flex:1;min-width:75px;background:var(--white);border:1.5px solid var(--border);border-radius:10px;padding:8px 10px;text-align:center;}
.bc-val{font-family:var(--mono);font-size:.95rem;font-weight:600;color:var(--navy);}
.bc-val.low{color:var(--red);}
.bc-lbl{font-size:.55rem;color:var(--gray);margin-top:2px;}
.big-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.big-btn{padding:20px 8px;border-radius:16px;border:2.5px solid;background:var(--white);font-size:1rem;font-weight:700;cursor:pointer;transition:all .14s;letter-spacing:.08em;display:flex;flex-direction:column;align-items:center;gap:5px;}
.big-btn .bb-sub{font-size:.58rem;font-family:var(--mono);opacity:.6;letter-spacing:.1em;}
.btn-in{border-color:var(--green);color:var(--green);}
.btn-in:active{background:#e8f8ef;transform:scale(.97);}
.btn-out{border-color:var(--red);color:var(--red);}
.btn-out:active{background:#fdf0f0;transform:scale(.97);}
.big-btn:disabled{opacity:.25;cursor:not-allowed;}
.lv-card{background:var(--white);border:1.5px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:12px;}
.lv-card-ttl{padding:8px 14px;border-bottom:1px solid var(--border);font-size:.6rem;color:var(--gray);font-weight:700;letter-spacing:.15em;text-transform:uppercase;}
.lv-grid{display:grid;grid-template-columns:1fr 1fr;}
.lv-btn{padding:11px 8px;border:none;border-right:1px solid var(--border);border-bottom:1px solid var(--border);background:transparent;color:var(--gray);font-size:.72rem;cursor:pointer;transition:all .14s;}
.lv-btn:nth-child(2n){border-right:none;}.lv-btn:nth-last-child(-n+2){border-bottom:none;}
.lv-btn:hover{background:var(--orange-lt);color:var(--orange-dk);}
.lv-btn:disabled{opacity:.3;cursor:not-allowed;}
.log-card{background:var(--white);border:1.5px solid var(--border);border-radius:var(--r);overflow:hidden;}
.log-ttl{padding:8px 14px;border-bottom:1px solid var(--border);font-size:.6rem;color:var(--gray);font-weight:700;letter-spacing:.15em;text-transform:uppercase;}
.li{display:flex;align-items:center;gap:9px;padding:8px 14px;border-bottom:1px solid var(--border);font-size:.76rem;}
.li:last-child{border-bottom:none;}
.li-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.d-in{background:var(--green);}.d-out{background:var(--red);}.d-lv{background:var(--gold);}
.li-txt{flex:1;}.li-t{font-family:var(--mono);font-size:.63rem;color:var(--gray);}
.li-del{background:transparent;border:none;color:var(--border2);cursor:pointer;font-size:.85rem;padding:0 3px;}
.li-del:hover{color:var(--red);}
.li-empty{padding:16px;text-align:center;font-size:.7rem;color:var(--gray);}

/* ── PIN ── */
.pin-body{max-width:300px;margin:60px auto 0;text-align:center;padding:0 16px;}
.pin-body h2{font-size:1rem;font-weight:700;letter-spacing:.1em;margin-bottom:6px;}
.pin-body p{font-size:.65rem;color:var(--gray);margin-bottom:18px;}
.pin-inp{width:100%;background:var(--white);border:2px solid var(--border2);border-radius:10px;color:var(--navy);font-family:var(--mono);font-size:1.3rem;text-align:center;padding:11px;outline:none;letter-spacing:.3em;}
.pin-inp:focus{border-color:var(--orange);}
.pin-btn{width:100%;margin-top:10px;padding:12px;background:var(--orange);border:none;border-radius:10px;color:#fff;font-size:.95rem;font-weight:700;cursor:pointer;}
.pin-err{color:var(--red);font-size:.68rem;margin-top:7px;height:16px;}

/* ── ADMIN ── */
.adm-hdr{background:var(--white);border-bottom:3px solid var(--orange);padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.adm-title{font-size:.82rem;font-weight:700;color:var(--orange-dk);}
.adm-tabs{display:flex;gap:4px;flex-wrap:wrap;}
.atab{padding:6px 14px;border-radius:999px;border:1.5px solid var(--border2);background:transparent;color:var(--gray);font-size:.68rem;font-weight:600;cursor:pointer;transition:all .14s;}
.atab.on{background:var(--orange);color:#fff;border-color:var(--orange);}
.adm-body{max-width:960px;margin:0 auto;padding:20px 16px 60px;}
.sec-hd{font-size:.6rem;font-weight:700;color:var(--gray);letter-spacing:.15em;text-transform:uppercase;padding-bottom:8px;border-bottom:2px solid var(--border);margin-bottom:14px;}
.tbl-wrap{background:var(--white);border:1.5px solid var(--border);border-radius:var(--r);overflow:hidden;overflow-x:auto;margin-bottom:20px;}
.tbl{width:100%;border-collapse:collapse;font-size:.76rem;white-space:nowrap;}
.tbl th{padding:8px 13px;border-bottom:1.5px solid var(--border);text-align:left;font-size:.6rem;color:var(--gray);letter-spacing:.1em;font-weight:700;text-transform:uppercase;}
.tbl td{padding:7px 13px;border-bottom:1px solid var(--border);}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr:hover td{background:var(--gray-lt);}
.bd{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.62rem;font-weight:600;}
.bd-ok{background:#e8f5ee;color:var(--green);}
.bd-out{background:#fdeaea;color:var(--red);}
.bd-lv{background:#fef3e2;color:var(--gold);}
.bd-no{background:var(--gray-lt);color:var(--gray);}
.sd-early{background:var(--orange-lt);color:var(--orange-dk);padding:2px 7px;border-radius:4px;font-size:.62rem;font-weight:600;}
.sd-mid{background:var(--teal-lt);color:var(--teal);padding:2px 7px;border-radius:4px;font-size:.62rem;font-weight:600;}
.sd-late2{background:var(--navy-lt);color:var(--navy);padding:2px 7px;border-radius:4px;font-size:.62rem;font-weight:600;}
.sd-all{background:var(--gray-lt);color:var(--gray);padding:2px 7px;border-radius:4px;font-size:.62rem;font-weight:600;}
.total-bar{background:linear-gradient(135deg,var(--orange-lt),var(--teal-lt));border:1.5px solid var(--orange);border-radius:var(--r);padding:14px 18px;display:flex;gap:20px;flex-wrap:wrap;margin-bottom:20px;}
.tb-item{display:flex;flex-direction:column;gap:2px;}
.tb-lbl{font-size:.6rem;color:var(--gray);font-family:var(--mono);letter-spacing:.1em;}
.tb-val{font-family:var(--mono);font-size:1rem;font-weight:600;}
.tb-val.orange{color:var(--orange-dk);}
.tb-val.red{color:var(--red);}
.leave-summary{background:var(--white);border:1.5px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:20px;}
.ls-hd{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;padding:8px 13px;border-bottom:1.5px solid var(--border);font-size:.6rem;color:var(--gray);font-weight:700;text-transform:uppercase;letter-spacing:.1em;}
.ls-row2{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;padding:8px 13px;border-bottom:1px solid var(--border);font-size:.76rem;align-items:center;}
.ls-row2:last-child{border-bottom:none;}
.ls-row2:hover{background:var(--gray-lt);}
.set-card{background:var(--white);border:1.5px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:14px;}
.set-card-title{font-size:.62rem;font-weight:700;color:var(--gray);letter-spacing:.12em;text-transform:uppercase;margin-bottom:12px;}
.set-field{flex:1;min-width:100px;}
.set-field label{display:block;font-size:.6rem;color:var(--gray);margin-bottom:4px;font-weight:600;}
.set-field input,.set-field select{width:100%;background:var(--gray-lt);border:1.5px solid var(--border2);border-radius:7px;color:var(--navy);font-family:var(--mono);font-size:.82rem;padding:7px 9px;outline:none;}
.set-field input:focus,.set-field select:focus{border-color:var(--orange);}
.set-btn{padding:7px 16px;background:var(--orange);border:none;border-radius:8px;color:#fff;font-size:.72rem;cursor:pointer;font-weight:600;transition:background .14s;}
.set-btn:hover{background:var(--orange-dk);}
.set-btn.sec{background:transparent;border:1.5px solid var(--border2);color:var(--gray);}
.print-btn{padding:7px 16px;background:var(--navy);border:none;border-radius:8px;color:#fff;font-size:.7rem;cursor:pointer;font-weight:600;margin-bottom:14px;}
.ed-inp{background:transparent;border:none;color:var(--navy);font-family:var(--mono);font-size:.76rem;width:70px;outline:none;text-align:right;}
.ed-inp:focus{border-bottom:1.5px solid var(--orange);}
.ed-nm{width:80px;text-align:left;font-family:var(--sans);}
.qr-box{background:var(--white);border:1.5px solid var(--border);border-radius:var(--r);padding:20px;text-align:center;margin-bottom:16px;}
.qr-box h3{font-size:.72rem;color:var(--gray);letter-spacing:.12em;margin-bottom:14px;font-weight:600;}
#qr-div{margin:0 auto 12px;display:inline-block;}
.qr-url{font-family:var(--mono);font-size:.63rem;color:var(--orange);word-break:break-all;margin-bottom:8px;}
.week-tbl-wrap{overflow-x:auto;margin-bottom:8px;}

/* ── LEDGER PAYSLIP ── */
.slip-wrap{display:flex;flex-direction:column;gap:28px;}
.ledger-slip{
  max-width:500px;
  background:#ffffff;
  color:#1a1510;
  border:2px solid #1a1510;
  font-family:'Noto Sans TC',sans-serif;
  page-break-inside:avoid;
}
.lhdr{
  background:#fce8e8;
  padding:10px 16px 8px;
  border-bottom:2px solid #1a1510;
  display:flex;justify-content:space-between;align-items:center;
}
.lhdr h3{font-size:.88rem;font-weight:700;color:#1a1510;letter-spacing:.06em;}
.lhdr .lsub{font-size:.7rem;color:#555;margin-top:2px;}
.lhdr .lshift{font-size:.68rem;border:1px solid #c0392b;color:#c0392b;padding:2px 8px;border-radius:3px;font-weight:600;}

/* Table-style rows */
.lbody{width:100%;}
.lrow{
  display:grid;grid-template-columns:1fr auto;
  border-bottom:1px solid #e0e0e0;
  min-height:28px;align-items:center;
}
.lrow .ll{
  font-size:.78rem;padding:4px 14px;
  border-right:1px solid #e0e0e0;
  line-height:1.4;
}
.lrow .ll small{display:block;font-size:.58rem;color:#888;font-family:'DM Mono',monospace;}
.lrow .lv{
  font-family:'DM Mono',monospace;font-size:.82rem;
  font-weight:500;padding:4px 14px;
  text-align:right;min-width:110px;
}
.lrow.income .lv{color:#1a7a4a;}
.lrow.deduct .lv{color:#c0392b;}
.lrow.zero .lv{color:#999;}

/* Total row - bold border top/bottom */
.ltotal{background:#fce8e8;border-top:2px solid #1a1510;border-bottom:2px solid #1a1510;}
.ltotal .ll{font-weight:700;font-size:.82rem;border-right:1px solid #1a1510;}
.ltotal .lv{font-size:.9rem;font-weight:700;}

/* Red total */
.lred{background:#fff0f0;border-top:2px solid #c0392b;border-bottom:2px solid #c0392b;}
.lred .ll{font-weight:700;font-size:.85rem;color:#c0392b;border-right:1px solid #c0392b;}
.lred .lv{font-size:.95rem;font-weight:700;color:#c0392b;}

/* Section divider */
.lgap{height:4px;background:#f5f5f5;border-top:1px solid #ccc;border-bottom:1px solid #ccc;}
.lsec{
  font-size:.62rem;font-weight:700;letter-spacing:.15em;color:#c0392b;
  padding:5px 14px 3px;border-bottom:1px solid #e0e0e0;
  text-transform:uppercase;background:#fff8f8;
}

/* Sign row */
.lsign{
  padding:8px 14px;display:flex;justify-content:space-between;
  font-size:.7rem;border-top:2px solid #1a1510;background:#f5f5f5;
}

/* Cost section */
.lcost{background:#fce8e8;border-top:2px solid #1a1510;}
.lcost-ttl{
  text-align:center;padding:5px 14px;font-size:.75rem;
  font-weight:700;border-bottom:1px solid #1a1510;letter-spacing:.15em;
}

/* Editable inputs */
.ledit{
  background:#fffdf8;
  border:1px solid #f0c090;
  border-radius:3px;
  font-family:'DM Mono',monospace;font-size:.82rem;color:#1a1510;
  text-align:right;width:110px;outline:none;padding:2px 6px;
}
.ledit:focus{background:#fff8f0;border-color:#f07b3f;}
.lleave-inp{
  background:#fffdf8;border:1px solid #e0d0b0;border-radius:3px;
  font-family:'DM Mono',monospace;font-size:.75rem;color:#1a1510;
  text-align:center;width:36px;outline:none;padding:1px 2px;
}
.lauto{font-size:.55rem;color:#2d6a4f;margin-left:4px;font-family:'DM Mono',monospace;}
.slip-total{background:linear-gradient(135deg,var(--orange-lt),var(--teal-lt));border:1.5px solid var(--orange);border-radius:var(--r);padding:14px 18px;display:flex;gap:20px;flex-wrap:wrap;margin-top:8px;}

@media print{
  .site-hdr,.adm-hdr,.adm-body>*:not(.slip-wrap),.print-btn,.set-btn,.slip-total{display:none!important;}
  .ledger-slip{max-width:100%;border:1.5px solid #000;page-break-after:always;box-shadow:none;}
}

/* ── MODAL ── */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .18s;}
.modal-ov.open{opacity:1;pointer-events:auto;}
.msheet{background:var(--white);border-radius:20px 20px 0 0;padding:18px 18px 40px;width:100%;max-width:440px;transform:translateY(50px);transition:transform .22s cubic-bezier(.2,.8,.3,1);}
.modal-ov.open .msheet{transform:translateY(0);}
.mhandle{width:32px;height:3px;background:var(--border2);border-radius:2px;margin:0 auto 14px;}
.mtitle{font-size:.88rem;font-weight:700;margin-bottom:14px;color:var(--navy);}
.mrow{margin-bottom:10px;}
.mrow label{display:block;font-size:.6rem;color:var(--gray);font-weight:700;margin-bottom:4px;letter-spacing:.1em;text-transform:uppercase;}
.mrow input,.mrow select{width:100%;background:var(--gray-lt);border:1.5px solid var(--border2);border-radius:8px;color:var(--navy);font-family:var(--sans);font-size:.88rem;padding:9px 11px;outline:none;}
.mrow input:focus,.mrow select:focus{border-color:var(--orange);}
.minline{display:flex;gap:8px;}.minline .mrow{flex:1;}
.msub{width:100%;padding:13px;background:var(--orange);border:none;border-radius:10px;color:#fff;font-size:.95rem;font-weight:700;cursor:pointer;margin-top:8px;}
.mcancel{width:100%;padding:10px;background:transparent;border:1.5px solid var(--border2);border-radius:10px;color:var(--gray);font-size:.75rem;cursor:pointer;margin-top:6px;}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--navy);border-radius:8px;padding:9px 18px;font-size:.78rem;color:#fff;opacity:0;transition:all .2s;z-index:200;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.ok{background:var(--green);}
.toast.err{background:var(--red);}

@media print{
  .site-hdr,.adm-hdr,.adm-body>*:not(.slip-wrap),.print-btn,.set-btn{display:none!important;}
  .slip-wrap{padding:0;}
  .ledger-slip{box-shadow:none;page-break-after:always;}
}

/* ── SCHEDULE TABLE ── */
.sch-wrap{overflow-x:auto;margin-bottom:20px;}
.sch-table{border-collapse:collapse;font-size:.72rem;white-space:nowrap;background:#fff;}
.sch-table th{padding:6px 8px;border:1px solid #ddd;text-align:center;font-size:.62rem;color:var(--gray);font-weight:600;background:var(--gray-lt);}
.sch-table td{padding:0;border:1px solid #ddd;text-align:center;min-width:38px;}
.sch-name{padding:5px 10px;font-weight:600;font-size:.75rem;text-align:left!important;background:var(--gray-lt);white-space:nowrap;}
.sch-cell{width:38px;height:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:700;transition:all .1s;user-select:none;-webkit-user-select:none;}
.sch-cell.early{background:#fff3ec;color:var(--orange-dk);}
.sch-cell.mid{background:var(--teal-lt);color:var(--teal);}
.sch-cell.late2{background:#eef0f8;color:var(--navy);}
.sch-cell.off{background:#f5f5f5;color:#bbb;}
.sch-cell:active{opacity:.7;}
.sch-today{background:#fffbe6!important;border:2px solid var(--gold)!important;}
.sch-sunday{opacity:.5;}
.sch-count-row td{background:var(--gray-lt);font-size:.62rem;font-weight:600;}
.sch-count-row .early-cnt{color:var(--orange-dk);}
.sch-count-row .mid-cnt{color:var(--teal);}
.sch-count-row .late-cnt{color:var(--navy);}
.sch-count-row .warn{color:var(--red);font-weight:700;}
.sch-legend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
.sch-leg-item{display:flex;align-items:center;gap:5px;font-size:.7rem;}
.sch-leg-dot{width:14px;height:14px;border-radius:3px;}
@media print{
  .adm-hdr,.adm-body>*:not(#print-schedule){display:none!important;}
  #print-schedule{display:block!important;}
  #ms-print-div{display:block!important;position:static!important;}
  body>*:not(#ms-print-div):not(#print-schedule){--_x:0;}
  .sch-table{font-size:.65rem;}
  .sch-cell{width:32px;height:26px;font-size:.6rem;}
}
</style>
</head>
<body>

<div id="err-box" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#c0392b;color:#fff;padding:10px 14px;font-size:.7rem;font-family:monospace;z-index:9999;max-height:200px;overflow-y:auto;"></div>
<script>
window.onerror = function(msg, src, line, col, err) {
  var box = document.getElementById('err-box');
  if(box) {
    box.style.display = 'block';
    box.innerHTML += '<div>⚠ ' + msg + ' | ' + (src||'').split('/').pop() + ':' + line + '</div>';
  }
  return false;
};
window.addEventListener('unhandledrejection', function(e) {
  var box = document.getElementById('err-box');
  if(box) {
    box.style.display = 'block';
    box.innerHTML += '<div>⚠ Promise: ' + (e.reason||'unknown') + '</div>';
  }
});
</script>

function annualEnt(hire){
  if(!hire)return 0;
  var mo=(Date.now()-new Date(hire))/86400000/30.44;
  var yr=mo/12;
  if(mo<6)return 0;if(yr<1)return 3;if(yr<2)return 7;if(yr<3)return 10;

  return Math.min(30,Math.floor(15+(yr-5)));
}

      if(l.type==='leave'&&l.leaveType===type){d+=l.days||0;h+=l.hours||0;}
    });}}
  return{days:d,hours:h,total:d+h/8};
}

function dayKey(n,ds){return 'xb3att_'+n+'_'+ds;}
function todayDs(){var n=new Date();return n.getFullYear()+''+pad(n.getMonth()+1)+pad(n.getDate());}
function ymNow(){var n=new Date();return n.getFullYear()+''+pad(n.getMonth()+1);}
function getDayLogs(name,ds){return JSON.parse(localStorage.getItem(dayKey(name,ds))||'[]');}
function saveDayLogs(name,ds,logs){
  localStorage.setItem(dayKey(name,ds),JSON.stringify(logs));
  fbSet('att/'+name.replace(/\s/g,'_')+'/'+ds,logs);
}
function syncDay(name,ds){
  return fbGet('att/'+name.replace(/\s/g,'_')+'/'+ds).then(function(data){
    if(data){var arr=Array.isArray(data)?data:Object.keys(data).map(function(k){return data[k];});localStorage.setItem(dayKey(name,ds),JSON.stringify(arr));}
  }).catch(function(){});
}

function tToMin(t){var parts=t.split(':');var h=Number(parts[0]);var m=Number(parts[1])||0;return h*60+m;}
function getMonthAtt(name,ym){
  var yr=parseInt(ym.slice(0,4)),mo=parseInt(ym.slice(4,6));
  var days=new Date(yr,mo,0).getDate();
  var emp=null;for(var _fi=0;_fi<emps.length;_fi++){if(emps[_fi].name===name){emp=emps[_fi];break;}}
  var r={sick_d:0,sick_h:0,pers_d:0,pers_h:0,annual_d:0,late_min:0,ot1_min:0,ot2_min:0};
  for(var d=1;d<=days;d++){
    var ds=ym+pad(d);
    var logs=getDayLogs(name,ds);
    if(!logs.length) continue;
    var sh=(function(){for(var _fi=0;_fi<logs.length;_fi++){if(logs[_fi].shift)return logs[_fi].shift;}return null;})();
    if(!sh) sh=emp?emp.shift:'early';
    var st=STIMES[sh]||STIMES['early'];
    for(var li=0;li<logs.length;li++){
      var l=logs[li];
      if(l.type!=='leave') continue;
      if(l.leaveType==='sick'){r.sick_d+=l.days||0;r.sick_h+=l.hours||0;}
      if(l.leaveType==='pers'){r.pers_d+=l.days||0;r.pers_h+=l.hours||0;}
      if(l.leaveType==='annual'){r.annual_d+=l.days||0;}
      if(l.leaveType==='late'){r.late_min+=(l.hours||0)*60+(l.mins||0);}
    }
    var hasManualLate=(function(){for(var _si=0;_si<logs.length;_si++){if(logs[_si].type==='leave'&&logs[_si].leaveType==='late')return true;}return false;})();
    if(!hasManualLate){
      var inLog=(function(){var _r=null;for(var _fi=0;_fi<logs.length;_fi++){if(logs[_fi].type==='in')_r=logs[_fi];}return _r;})();
      if(inLog){var diff=tToMin(inLog.time)-tToMin(st.in);if(diff>5)r.late_min+=diff;}
    }
    var outLog=(function(){var _r=null;for(var _fi=0;_fi<logs.length;_fi++){if(logs[_fi].type==='out')_r=logs[_fi];}return _r;})();
    if(outLog){
      var ot=tToMin(outLog.time)-tToMin(st.out);
      if(ot>=30){r.ot1_min+=Math.min(ot,120);r.ot2_min+=Math.max(0,ot-120);}
    }
  }
  return r;
}

function calcPay(emp,att,adj){
  adj=adj||{};
  var salaryKeys=['base','sup','admin','welfare','insured'];
  function get(k,def){
    if(adj[k]!==undefined){
      var isSal=salaryKeys.indexOf(k)>=0;
      if(isSal && adj[k]===0 && (emp[k]||0)>0) return emp[k]||def||0;
      return adj[k];
    }
    return emp[k]!==undefined ? emp[k] : (def||0);
  }
  var base=get('base',30000),sup=get('sup',0),adm=get('admin',0),wel=get('welfare',0);
  var rawIns=get('insured',0);
  var ins=rawIns>0?toGrade(rawIns,LI_GRADES):suggestGrade(base+sup+adm);
  var hourly=base/30/8,daily=base/30;
  var ot1_min=att.ot1_min||0,ot2_min=att.ot2_min||0;
  var ot1_pay=Math.round(hourly*1.34*(ot1_min/60));
  var ot2_pay=Math.round(hourly*1.67*(ot2_min/60));
  var ot_total=ot1_pay+ot2_pay;
  var semester=get('semester',0),bonus=get('bonus',0),yearend=get('yearend',0);
  var gross=base+sup+adm+wel+ot_total+semester+bonus+yearend;
  var li_ee=Math.round(ins*LI_RATE*LI_EE_RATIO);
  var dep_count=emp.dep_count||0;
  var hi_ee_self=Math.round(ins*HI_RATE*HI_EE_RATIO);
  var hi_ee_dep=Math.round(ins*HI_RATE*HI_EE_RATIO*dep_count);
  var hi_ee=hi_ee_self;
  var hi_dep=get('hi_dep',0);
  var sick_d=adj.sick_d!==undefined?adj.sick_d:(att.sick_d||0);
  var sick_h=adj.sick_h!==undefined?adj.sick_h:(att.sick_h||0);
  var pers_d=adj.pers_d!==undefined?adj.pers_d:(att.pers_d||0);
  var pers_h=adj.pers_h!==undefined?adj.pers_h:(att.pers_h||0);
  var sick_cut=Math.round(daily*0.5*sick_d+hourly*0.5*sick_h);
  var pers_cut=Math.round(daily*pers_d+hourly*pers_h);
  var late_cut=Math.round(hourly*((att.late_min||0)/60));
  var total_deduct=li_ee+hi_ee+hi_dep+sick_cut+pers_cut+late_cut;
  var net=gross-total_deduct;
  var li_er=Math.round(ins*LI_RATE*LI_ER_RATIO);
  var hi_er=Math.round(ins*HI_RATE*HI_ER_RATIO*1.56);
  var pen_er=Math.round(ins*PEN);
  var cost=gross+li_er+hi_er+pen_er;
  var total_hi_ee=hi_ee_self+hi_ee_dep;
  return{base:base,sup:sup,adm:adm,wel:wel,ins:ins,hourly:hourly,daily:daily,
    ot1_min:ot1_min,ot2_min:ot2_min,ot1_pay:ot1_pay,ot2_pay:ot2_pay,ot_total:ot_total,
    semester:semester,bonus:bonus,yearend:yearend,gross:gross,
    li_ee:li_ee,hi_ee:hi_ee,hi_ee_dep:hi_ee_dep,hi_dep:hi_dep,
    sick_d:sick_d,sick_h:sick_h,pers_d:pers_d,pers_h:pers_h,
    sick_cut:sick_cut,pers_cut:pers_cut,late_cut:late_cut,
    total_deduct:total_deduct,net:net,li_er:li_er,hi_er:hi_er,pen_er:pen_er,cost:cost};
}

function buildAtt(){
  var dateEl=document.getElementById('att-date');
  var empEl=document.getElementById('att-emp');
  if(!dateEl) return;
  var selDate=dateEl.value; // YYYY-MM-DD
  var fe=empEl?empEl.value:'';
  var yr=parseInt(selDate.slice(0,4)),mo=parseInt(selDate.slice(5,7)),dy=parseInt(selDate.slice(8,10));
  var ds=selDate.replace(/-/g,''); // YYYYMMDD
  var ym=selDate.slice(0,4)+pad(mo); // YYYYMM
  var days=new Date(yr,mo,0).getDate();
  var n=new Date();
  var todayDs=n.getFullYear()+''+pad(n.getMonth()+1)+pad(n.getDate());
  var isToday=(ds===todayDs);
  var dow=['日','一','二','三','四','五','六'][new Date(yr,mo-1,dy).getDay()];

  // 今日打卡卡片（醒目顯示）
  var todayPanel=document.getElementById('att-today-panel');
  if(todayPanel){
    var showEmps2=fe?emps.filter(function(e){return e.name===fe;}):emps;
    var cards='';
    showEmps2.forEach(function(emp){
      var logs=getDayLogs(emp.name,ds);
      var li=(function(){var _r=null;for(var _fi=0;_fi<logs.length;_fi++){if(logs[_fi].type==='in')_r=logs[_fi];}return _r;})();
      var lo=(function(){var _r=null;for(var _fi=0;_fi<logs.length;_fi++){if(logs[_fi].type==='out')_r=logs[_fi];}return _r;})();
      var lv=logs.find(function(l){return l.type==='leave';});
      var on=li&&(!lo||li.ts>lo.ts);
      var sc={'early':'var(--orange)','mid':'var(--teal)','late2':'var(--navy)'}[emp.shift]||'var(--gray)';
      cards+='<div style="background:#fff;border-radius:12px;border:1.5px solid var(--border);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;">'
        +'<div style="display:flex;align-items:center;gap:10px;">'
        +'<div style="width:36px;height:36px;border-radius:50%;background:'+sc+';color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.95rem;">'+emp.name[0]+'</div>'
        +'<div>'
        +'<div style="font-size:.82rem;font-weight:700;color:var(--navy);">'+emp.name+'</div>'
        +'<div style="font-size:.62rem;color:var(--gray);">'+(lv?'<span style="color:var(--gold);">'+LVNAMES[lv.leaveType]+'</span>':(li?'上班 '+li.time:'─'))+(lo?' &nbsp; 下班 '+lo.time:'')+'</div>'
        +'</div></div>'
        +'<div style="text-align:right;">'
        +'<div style="font-size:.68rem;font-family:var(--mono);padding:3px 10px;border-radius:999px;'+(on?'background:#e8f8ef;color:var(--green);font-weight:600;':lo?'background:#fdeaea;color:var(--red);':'background:var(--gray-lt);color:var(--gray);')+'">'+(on?'上班中':lo?'已下班':lv?'請假':'未到')+'</div>'
        +'</div></div>';
    });
    todayPanel.innerHTML='<div style="background:var(--orange-lt);border:1.5px solid var(--orange);border-radius:12px;padding:12px 14px;margin-bottom:8px;">'
      +'<div style="font-size:.65rem;font-weight:700;color:var(--orange-dk);letter-spacing:.12em;margin-bottom:10px;">'
      +(isToday?'📅 今日出勤 ':'📅 ')
      +yr+'/'+(mo<10?'0':'')+mo+'/'+(dy<10?'0':'')+dy+' ('+dow+')'
      +(isToday?'&nbsp;<span style="background:var(--orange);color:#fff;padding:1px 7px;border-radius:999px;font-size:.6rem;">今天</span>':'')
      +'</div>'
      +'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;">'+cards+'</div>'
      +'</div>';
  }

  // 下方表格：顯示整個月
  var showEmps=fe?emps.filter(function(e){return e.name===fe;}):emps;
  var rows=[];
  for(var d=1;d<=days;d++){
    var ds2=ym+pad(d);
    var date2=new Date(yr,mo-1,d);
    var dow2=['日','一','二','三','四','五','六'][date2.getDay()];
    var wknd=date2.getDay()===0||date2.getDay()===6;
    var isSelDay=(ds2===ds);
    showEmps.forEach(function(emp){
      var logs=getDayLogs(emp.name,ds2);
      if(!logs.length&&fe) return;
      var li=(function(){var _r=null;for(var _fi=0;_fi<logs.length;_fi++){if(logs[_fi].type==='in')_r=logs[_fi];}return _r;})();
      var lo=(function(){var _r=null;for(var _fi=0;_fi<logs.length;_fi++){if(logs[_fi].type==='out')_r=logs[_fi];}return _r;})();
      var lv=logs.find(function(l){return l.type==='leave';});
      var sl=logs.find(function(l){return l.shift;});
      var st='',sc2='bd-no';
      if(li&&lo){st='正常出勤';sc2='bd-ok';}
      else if(li){st='未打下班';sc2='bd-out';}
      else if(lv){st=LVNAMES[lv.leaveType]||'請假';sc2='bd-lv';}
      else if(!wknd){st='未到';}
      if(!st) return;
      var rowStyle=wknd?'opacity:.35':'';
      if(isSelDay) rowStyle+=(rowStyle?';':'')+'background:var(--orange-lt);';
      var sn=sl?'<span class="sd-'+sl.shift+'">'+SNAMES[sl.shift]+'</span>':'';
      rows.push('<tr style="'+rowStyle+'"><td>'+(mo<10?'0':'')+mo+'/'+(d<10?'0':'')+d+'('+dow2+')'+(isSelDay?'&nbsp;●':'')+'</td>'
        +(showEmps.length>1?'<td>'+emp.name+'</td>':'')
        +'<td>'+sn+'</td>'
        +'<td>'+(li?li.time:'─')+'</td>'
        +'<td>'+(lo?lo.time:'─')+'</td>'
        +'<td><span class="bd '+sc2+'">'+st+'</span></td>'
        +'<td style="font-size:.65rem;color:var(--gray);">'+(lv&&lv.note?lv.note:'')+'</td></tr>');
    });
  }
  var tbl=document.getElementById('att-tbl');
  if(tbl) tbl.innerHTML='<thead><tr><th>日期</th>'+(showEmps.length>1?'<th>姓名</th>':'')+'<th>班別</th><th>上班</th><th>下班</th><th>狀態</th><th>備註</th></tr></thead>'
    +'<tbody>'+(rows.join('')||'<tr><td colspan="7" style="text-align:center;padding:20px;color:var(--gray);font-size:.72rem;">本月尚無記錄</td></tr>')+'</tbody>';
}

function renderLeave(body){
  var rows='';
  for(var i=0;i<emps.length;i++){
    var e=emps[i];
    var aT=annualEnt(e.hire),aU=usedLeave(e.name,'annual').total,aL=Math.max(0,aT-aU);
    var sU=usedLeave(e.name,'sick').total,sL=Math.max(0,30-sU);
    var yrs=e.hire?((Date.now()-new Date(e.hire))/365.25/86400000).toFixed(1):'─';
    rows+='<div class="ls-row2"><span style="font-weight:700;">'+e.name+'</span>'
      +'<span><span class="sd-'+e.shift+'">'+SNAMES[e.shift]+'</span></span>'
      +'<span style="font-family:var(--mono);'+(aL<=1?'color:var(--red)':'')+'" >'+aL.toFixed(1)+' / '+aT+'</span>'
      +'<span style="font-family:var(--mono);'+(sL<=2?'color:var(--red)':'')+'" >'+sL.toFixed(1)+' / 30</span>'
      +'<span style="font-family:var(--mono);color:var(--gray);">'+yrs+' 年</span></div>';
  }
  body.innerHTML='<div class="sec-hd">假別總覽（本年度）</div><div class="leave-summary">'
    +'<div class="ls-hd"><span>姓名</span><span>班別</span><span>特休(剩/總)</span><span>病假(剩/30)</span><span>年資</span></div>'
    +rows+'</div>';
}

// ── 月底結算（薪資單）──
// ════ 月確認單列印 ════
function getLeaveByType(name, ym, leaveType) {
  var yr = parseInt(ym.slice(0,4)), mo = parseInt(ym.slice(4,6));
  var days = new Date(yr, mo, 0).getDate();
  var total = 0;
  for (var d = 1; d <= days; d++) {
    getDayLogs(name, ym + pad(d)).forEach(function(l) {
      if (l.type === 'leave' && l.leaveType === leaveType) total += (l.days || 0) + (l.hours || 0) / 8;
    });
  }
  return total;
}

function getCumLeave(name, yr, upToMo, leaveType) {
  var total = 0;
  for (var m = 1; m < upToMo; m++) {
    var ym2 = yr + '' + pad(m);
    var days2 = new Date(yr, m, 0).getDate();
    for (var d = 1; d <= days2; d++) {
      getDayLogs(name, ym2 + pad(d)).forEach(function(l) {
        if (l.type === 'leave' && l.leaveType === leaveType) total += (l.days || 0) + (l.hours || 0) / 8;
      });
    }
  }
  return total;
}

function getAnnualDates(name, yr) {
  var result = [];
  for (var m = 1; m <= 12; m++) {
    var ym2 = yr + '' + pad(m);
    var days2 = new Date(yr, m, 0).getDate();
    for (var d = 1; d <= days2; d++) {
      var ds = ym2 + pad(d);
      getDayLogs(name, ds).forEach(function(l) {
        if (l.type === 'leave' && l.leaveType === 'annual') {
          result.push({ date: (m) + '/' + pad(d), days: l.days || 1 });
        }
      });
    }
  }
  return result;
}

function hireToROC(hire) {
  if (!hire) return '─';
  var p = hire.split('-');
  return (parseInt(p[0]) - 1911) + ' 年 ' + parseInt(p[1]) + ' 月 ' + parseInt(p[2]) + ' 日';
}

function saveConfInp(adjKey, key, val, ym, rocY, mo) {
  var a = JSON.parse(localStorage.getItem(adjKey) || '{}');
  var num = parseFloat(val);
  a[key] = (val === '' || isNaN(num)) ? val : num;
  localStorage.setItem(adjKey, JSON.stringify(a));
  fbSet('adj/' + adjKey, a);
  showPayTab('confirm', ym, rocY, mo);
}
function saveAnnLeave(annKey, key, val, ym, rocY, mo) {
  var a = JSON.parse(localStorage.getItem(annKey) || '{}');
  a[key] = val;
  localStorage.setItem(annKey, JSON.stringify(a));
  fbSet('ann/' + annKey, a);
  showPayTab('confirm', ym, rocY, mo);
}
function addAnnSlot(annKey, ym, rocY, mo) {
  var a = JSON.parse(localStorage.getItem(annKey) || '{}');
  a['slots'] = Math.max(12, parseInt(a['slots'] || 12)) + 6;
  localStorage.setItem(annKey, JSON.stringify(a));
  fbSet('ann/' + annKey, a);
  showPayTab('confirm', ym, rocY, mo);
}

  var rawIns=gv('insured',0);
  var ins = rawIns>0 ? toGrade(rawIns,LI_GRADES) : suggestGrade(base+sup+adm);
  var dep_total = emp.dep_count||0;
  var a2 = getA();
  var dep_pay = a2.dep_pay!==undefined ? a2.dep_pay : dep_total;
  var ot1_min = a2.ot1_min!==undefined ? a2.ot1_min : (a2.ot1_h!==undefined ? Math.round(a2.ot1_h*60) : 0);
  var ot2_min = a2.ot2_min!==undefined ? a2.ot2_min : (a2.ot2_h!==undefined ? Math.round(a2.ot2_h*60) : 0);
  var ot1_pay = Math.ceil((base/30/8)*1.34*(ot1_min/60));

  var sick_d  = a2.sick_d  !==undefined ? a2.sick_d  : (att.sick_d ||0);
  var sick_h2 = a2.sick_h2 !==undefined ? a2.sick_h2 : (att.sick_h ||0);
  var pers_d  = a2.pers_d  !==undefined ? a2.pers_d  : (att.pers_d ||0);
  var pers_h2 = a2.pers_h2 !==undefined ? a2.pers_h2 : (att.pers_h ||0);

  var pers_cut = Math.round(daily*pers_d + hourly*pers_h2);

function showPayTab(tab,ym2,rocY2,mo2){
  var ym=ym2||ymNow();
  var n=new Date();
  var rocY=rocY2||(n.getFullYear()-1911);
  var mo=mo2||parseInt(ym.slice(4));
  var ST_ON='padding:7px 18px;border:none;border-radius:8px;font-size:.75rem;font-weight:700;cursor:pointer;';
  var ST_OFF='padding:7px 18px;border:1.5px solid var(--border2);border-radius:8px;font-size:.75rem;font-weight:600;cursor:pointer;background:transparent;color:var(--gray);';
  var tSlip=document.getElementById('pay-tab-slip');
  var tConf=document.getElementById('pay-tab-confirm');
  var sub=document.getElementById('pay-sub');
  if(!sub) return;
  _payTab = tab;
  if(tab==='slip'){
    if(tSlip) tSlip.style.cssText=ST_ON+'background:var(--orange);color:#fff;';

  } else {
    if(tConf) tConf.style.cssText=ST_ON+'background:var(--teal);color:#fff;';

    function _renderConfirm(){

      sub.innerHTML='<div style="display:flex;flex-direction:column;gap:24px;">'+html+'</div>';
    }
    if(window._fb&&window._fb.ready){
      Promise.all([fbGet('adj'),fbGet('ann')]).then(function(res){
        var adjData=res[0],annData=res[1];
        showToast(adjData?'☁️ 雲端資料載入成功':'⚠️ 雲端資料為空（'+typeof adjData+'）', adjData?'ok':'err');
        if(adjData&&typeof adjData==='object') Object.keys(adjData).forEach(function(k){localStorage.setItem(k,JSON.stringify(adjData[k]));});
        if(annData&&typeof annData==='object') Object.keys(annData).forEach(function(k){localStorage.setItem(k,JSON.stringify(annData[k]));});
        _renderConfirm();
      }).catch(function(e){showToast('❌ Firebase 讀取失敗：'+e.message,'err');_renderConfirm();});
    } else {
      _renderConfirm();
    }
  }
}

function buildSlips(ym,rocY,mo){
  // 先同步Firebase
  if(window._fb&&window._fb.ready){
    window._fb.get(window._fb.ref(window._fb.db,'att')).then(function(snap){
      if(snap.exists()){var data=snap.val();
        Object.keys(data).forEach(function(nk){var dates=data[nk];
          if(!dates||typeof dates!=='object')return;
          var name=nk.replace(/_/g,' ');
          Object.keys(dates).forEach(function(ds){var logs=dates[ds];
            if(!logs)return;
            localStorage.setItem(dayKey(name,ds),JSON.stringify(Array.isArray(logs)?logs:Object.keys(logs).map(function(k){return logs[k];})));
          });
        });}
      _buildSlips(ym,rocY,mo);
    }).catch(function(){_buildSlips(ym,rocY,mo);});
  }else _buildSlips(ym,rocY,mo);
}


function _buildSlips(ym,rocY,mo){
  var wrap=document.getElementById('slip-wrap');
  if(!wrap) return;
  wrap.innerHTML='';
  var grandNet=0,grandCost=0;

  for(var ei=0;ei<emps.length;ei++){
    var emp=emps[ei];
    var adjKey='xb4adj_'+emp.id+'_'+ym;

    function getA(){ return JSON.parse(localStorage.getItem(adjKey)||'{}'); }
    function gv(k,def){
      var a=getA();
      if(a[k]!==undefined){
        var isSal=(k==='base'||k==='sup'||k==='admin'||k==='welfare'||k==='insured');
        if(isSal && a[k]===0 && (emp[k]||0)>0) return emp[k]||def||0;
        return a[k];
      }
      return emp[k]!==undefined?emp[k]:(def||0);
    }

    var base    = gv('base',30000);
    var sup     = gv('sup',0);
    var adm     = gv('admin',0);
    var wel     = gv('welfare',0);
    var sem     = gv('semester',0);
    var bon     = gv('bonus',0);
    var yend    = gv('yearend',0);
    var rawIns  = gv('insured',0);
    var ins     = rawIns>0 ? toGrade(rawIns,LI_GRADES) : suggestGrade(base+sup+adm);
    var dep     = emp.dep_count||0;
    var base_total = base+sup+adm+wel;
    var daily   = base_total/30;
    var hourly  = base_total/30/8;
    var ot1_min = gv('ot1_min',0);
    var ot2_min = gv('ot2_min',0);
    var ot1_pay = Math.ceil((base/30/8)*1.34*(ot1_min/60));
    var ot2_pay = Math.ceil((base/30/8)*1.67*(ot2_min/60));
    var ot_tot  = ot1_pay+ot2_pay;
    var att     = getMonthAtt(emp.name,ym);
    var a2      = getA();
    var sick_d  = a2.sick_d!==undefined ? a2.sick_d : (att.sick_d||0);
    var sick_h  = a2.sick_h!==undefined ? a2.sick_h : (att.sick_h||0);
    var pers_d  = a2.pers_d!==undefined ? a2.pers_d : (att.pers_d||0);
    var pers_h  = a2.pers_h!==undefined ? a2.pers_h : (att.pers_h||0);
    var sick_cut = Math.round(daily*0.5*sick_d + hourly*0.5*sick_h);
    var pers_cut = Math.round(daily*pers_d + hourly*pers_h);
    var late_cut = Math.round(hourly*((att.late_min||0)/60));
    var li_ee   = Math.round(ins*LI_RATE*LI_EE_RATIO);
    var hi_self = Math.round(ins*HI_RATE*HI_EE_RATIO);
    var hi_dep  = dep>0 ? Math.round(ins*HI_RATE*HI_EE_RATIO*dep) : 0;
    var li_er   = Math.round(ins*LI_RATE*LI_ER_RATIO);
    var hi_er   = Math.round(ins*HI_RATE*HI_ER_RATIO*1.56);
    var pen_er  = Math.round(ins*PEN);
    var gross   = base+sup+adm+wel+ot_tot+sem+bon+yend;
    var tot_ded = li_ee+hi_self+hi_dep+sick_cut+pers_cut+late_cut;
    var net     = gross-tot_ded;
    var cost    = gross+li_er+hi_er+pen_er;
    grandNet+=net; grandCost+=cost;

    function fv(n){ return '$'+(Math.ceil(n||0)).toLocaleString(); }
    function fn2(n){ return n>0 ? ('-$'+Math.abs(Math.round(n)).toLocaleString()) : '$0'; }

    var OTS='width:72px;background:#fff8f0;border:1.5px solid var(--orange);border-radius:6px;font-family:var(--mono);font-size:.88rem;text-align:center;padding:4px 6px;outline:none;';
    var BNS='width:100px;background:#fff8f0;border:1px solid var(--orange);border-radius:5px;font-family:var(--mono);font-size:.82rem;text-align:right;padding:3px 6px;outline:none;';
    var LVS='width:40px;background:#fff8f0;border:1px solid #ddd;border-radius:5px;font-family:var(--mono);font-size:.78rem;text-align:center;padding:2px;outline:none;';

    function mk(key,val,style,step,max){
      return '<input type="number" min="0"'
        +' step="'+(step||100)+'"'
        +(max?' max="'+max+'"':'')
        +' value="'+(val||0)+'"'
        +' style="'+style+'"'
        +' class="slip-inp"'
        +' data-adjkey="'+adjKey+'"'
        +' data-key="'+key+'"'
        +' data-ym="'+ym+'"'
        +' data-rocy="'+rocY+'"'
        +' data-mo="'+mo+'">';
    }

    var sc={'early':'var(--orange)','mid':'var(--teal)','late2':'var(--navy)'}[emp.shift]||'var(--gray)';
    var hasSick=(att.sick_d||0)>0||(att.sick_h||0)>0;
    var hasPers=(att.pers_d||0)>0||(att.pers_h||0)>0;

    var h='';
    h+='<div style="background:#fff;border-radius:16px;border:1.5px solid var(--border);box-shadow:0 2px 12px rgba(0,0,0,.07);overflow:hidden;">';

    // 薪資單頂部 header
    h+='<div style="background:#fce8e8;padding:10px 16px 8px;border-bottom:2px solid #1a1510;display:flex;justify-content:space-between;align-items:center;">'
      +'<div style="display:flex;align-items:center;gap:8px;">'
      +'<img src="'+LOGO_SRC+'" style="width:28px;height:28px;object-fit:contain;">'
      +'<div><div style="font-size:.82rem;font-weight:700;color:#1a1510;">小布迪音樂藝術托嬰中心</div>'
      +'<div style="font-size:.62rem;color:#666;margin-top:1px;">'+emp.name+' 薪資單 &nbsp;·&nbsp; 民國 '+rocY+' 年 '+mo+' 月</div></div>'
      +'</div>'
      +'<span style="background:'+sc+';color:#fff;padding:3px 10px;border-radius:999px;font-size:.65rem;font-weight:600;">'+SNAMES[emp.shift]+'</span>'
      +'</div>';

    // 頂部（姓名 + 實領）
    h+='<div style="padding:14px 18px 10px;border-bottom:1px solid var(--border);">';
    h+='<div style="display:flex;justify-content:space-between;align-items:flex-start;">';
    h+='<div>'
      +'<div style="font-size:1rem;font-weight:700;color:var(--navy);">'+emp.name+'</div>'
      +'<div style="font-size:.62rem;color:var(--gray);margin-top:3px;">'+emp.hire
      +'&nbsp;<span style="background:'+sc+';color:#fff;padding:2px 8px;border-radius:999px;font-size:.6rem;font-weight:600;">'+SNAMES[emp.shift]+'</span></div>'
      +'</div>';
    h+='<div style="text-align:right;">'
      +'<div style="font-size:.58rem;color:var(--gray);">實領薪資</div>'
      +'<div style="font-family:var(--mono);font-size:1.4rem;font-weight:700;color:var(--teal);">'+fv(net)+'</div>'
      +'</div></div></div>';

    // 應領
    h+='<div style="padding:12px 18px 8px;border-bottom:1px solid var(--border);">';
    h+='<div style="font-size:.6rem;font-weight:700;color:var(--orange);letter-spacing:.12em;margin-bottom:8px;">應領項目</div>';
    function sr(l,v){ return '<div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #f0ece6;"><span style="font-size:.78rem;color:#555;">'+l+'</span><span style="font-family:var(--mono);font-size:.82rem;font-weight:500;">'+fv(v)+'</span></div>'; }
    if(base) h+=sr('底薪',base);
    if(sup)  h+=sr('主管津貼',sup);
    if(adm)  h+=sr('行政津貼',adm);
    if(wel)  h+=sr('福利津貼',wel);
    h+='<div style="display:flex;justify-content:space-between;padding:5px 0;border-top:1.5px solid var(--orange);border-bottom:1px solid var(--border);margin:4px 0;">'
      +'<span style="font-size:.78rem;font-weight:700;color:var(--orange-dk);">薪資小計</span>'
      +'<span style="font-family:var(--mono);font-size:.85rem;font-weight:700;color:var(--orange-dk);">'+fv(base_total)+'</span></div>';

    // 加班
    h+='<div style="background:var(--orange-lt);border-radius:8px;padding:10px;margin:8px 0;">';
    h+='<div style="font-size:.6rem;font-weight:700;color:var(--orange-dk);margin-bottom:8px;">加班費（輸入分鐘，自動計算）</div>';
    h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">'
      +'<span style="font-size:.75rem;color:#555;width:80px;">前段 ×1.34</span>'
      +mk('ot1_min',ot1_min,OTS,30,480)
      +'<span style="font-size:.7rem;color:var(--gray);">分鐘</span>'
      +(ot1_min>0?'<span style="font-family:var(--mono);font-size:.82rem;font-weight:600;color:var(--green);">= '+fv(ot1_pay)+'</span>':'')
      +'</div>';
    h+='<div style="display:flex;align-items:center;gap:8px;">'
      +'<span style="font-size:.75rem;color:#555;width:80px;">後段 ×1.67</span>'
      +mk('ot2_min',ot2_min,OTS,30,480)
      +'<span style="font-size:.7rem;color:var(--gray);">分鐘</span>'
      +(ot2_min>0?'<span style="font-family:var(--mono);font-size:.82rem;font-weight:600;color:var(--green);">= '+fv(ot2_pay)+'</span>':'')
      +'</div>';
    if(ot_tot>0) h+='<div style="text-align:right;font-family:var(--mono);font-size:.82rem;font-weight:700;color:var(--green);margin-top:6px;">加班費 '+fv(ot_tot)+'</div>';
    h+='</div>';

    // 獎金（展開）
    h+='<details style="margin-bottom:4px;">';
    h+='<summary style="font-size:.68rem;color:var(--teal);cursor:pointer;font-weight:600;padding:4px 0;">▶ ✏ 學期考核 / 獎金 / 年終</summary>';
    h+='<div style="margin-top:6px;display:grid;grid-template-columns:1fr 1fr;gap:8px;">';
    h+='<div><div style="font-size:.6rem;color:var(--gray);margin-bottom:3px;">學期考核</div>'+mk('semester',sem,BNS)+'</div>';
    h+='<div><div style="font-size:.6rem;color:var(--gray);margin-bottom:3px;">獎金</div>'+mk('bonus',bon,BNS)+'</div>';
    h+='<div><div style="font-size:.6rem;color:var(--gray);margin-bottom:3px;">年終獎金</div>'+mk('yearend',yend,BNS)+'</div>';
    h+='</div></details>';
    if(sem>0||bon>0||yend>0){
      h+='<div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #f0ece6;">'
        +'<span style="font-size:.78rem;color:#555;">學期考核/獎金小計</span>'
        +'<span style="font-family:var(--mono);font-size:.82rem;font-weight:500;">'+fv(sem+bon+yend)+'</span></div>';
    }

    // 總金額
    h+='<div style="display:flex;justify-content:space-between;padding:7px 0;border-top:2px solid var(--navy);margin-top:4px;">'
      +'<span style="font-size:.88rem;font-weight:700;">總金額</span>'
      +'<span style="font-family:var(--mono);font-size:.95rem;font-weight:700;">'+fv(gross)+'</span></div>';
    h+='</div>';

    // 扣除
    h+='<div style="padding:12px 18px;border-bottom:1px solid var(--border);">';
    h+='<div style="font-size:.6rem;font-weight:700;color:var(--red);letter-spacing:.12em;margin-bottom:8px;">扣除項目</div>';
    function dr(l,v){ return '<div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #f5f0ec;"><span style="font-size:.78rem;color:#555;">'+l+'</span><span style="font-family:var(--mono);font-size:.82rem;color:var(--red);">'+fn2(v)+'</span></div>'; }
    h+=dr('勞保（個人 2.4%）',li_ee);
    h+=dr('健保（個人 2.35%）',hi_self);
    if(dep>0) h+=dr('眷屬保費（'+dep+'人）',hi_dep);

    // 病假
    h+='<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #f5f0ec;">'
      +'<span style="font-size:.78rem;color:#555;">請病假（扣考核）'
      +(hasSick?'<span style="font-size:.58rem;color:var(--green);margin-left:4px;background:#e8f8ef;padding:1px 5px;border-radius:3px;">↑打卡</span>':'')
      +'<br><span style="font-size:.65rem;color:var(--gray);">'
      +mk('sick_d',sick_d,LVS,1,30)+'天 '
      +mk('sick_h',sick_h,LVS,1,7)+'時</span></span>'
      +'<span style="font-family:var(--mono);font-size:.82rem;color:var(--red);">'+fn2(sick_cut)+'</span></div>';

    // 事假
    h+='<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #f5f0ec;">'
      +'<span style="font-size:.78rem;color:#555;">請事假（扣考核）'
      +(hasPers?'<span style="font-size:.58rem;color:var(--green);margin-left:4px;background:#e8f8ef;padding:1px 5px;border-radius:3px;">↑打卡</span>':'')
      +'<br><span style="font-size:.65rem;color:var(--gray);">'
      +mk('pers_d',pers_d,LVS,1,30)+'天 '
      +mk('pers_h',pers_h,LVS,1,7)+'時</span></span>'
      +'<span style="font-family:var(--mono);font-size:.82rem;color:var(--red);">'+fn2(pers_cut)+'</span></div>';

    // 扣除合計
    h+='<div style="display:flex;justify-content:space-between;padding:6px 0;border-top:2px solid var(--red);margin-top:4px;">'
      +'<span style="font-size:.82rem;font-weight:700;color:var(--red);">扣除合計</span>'
      +'<span style="font-family:var(--mono);font-size:.88rem;font-weight:700;color:var(--red);">'+(tot_ded>0?'-$'+tot_ded.toLocaleString():'$0')+'</span></div>';
    h+='</div>';

    // 實領
    h+='<div style="margin:12px 18px;padding:14px 16px;background:linear-gradient(135deg,var(--teal-lt),#f0faf5);border-radius:12px;border:2px solid var(--teal);display:flex;justify-content:space-between;align-items:center;">'
      +'<span style="font-size:.88rem;font-weight:700;color:var(--teal-dk);letter-spacing:.08em;">實　領　薪　資</span>'
      +'<span style="font-family:var(--mono);font-size:1.5rem;font-weight:700;color:var(--teal-dk);">'+fv(net)+'</span></div>';

    // 投保 + 人事成本
    h+='<div style="padding:10px 18px 14px;border-top:1px solid var(--border);">';
    h+='<div style="display:flex;justify-content:space-between;margin-bottom:4px;">'
      +'<span style="font-size:.7rem;color:var(--gray);">投保金額</span>'
      +'<span style="font-family:var(--mono);font-size:.75rem;font-weight:600;color:var(--navy);">$'+ins.toLocaleString()+'</span></div>';
    h+='<div style="display:flex;gap:12px;font-family:var(--mono);font-size:.63rem;color:var(--gray);flex-wrap:wrap;">'
      +'<span>勞保(雇) '+fv(li_er)+'</span>'
      +'<span>健保(雇) '+fv(hi_er)+'</span>'
      +'<span>勞退 '+fv(pen_er)+'</span></div>';
    h+='<div style="display:flex;justify-content:space-between;margin-top:6px;padding-top:6px;border-top:1px solid var(--border);">'
      +'<span style="font-size:.75rem;font-weight:700;color:var(--red);">人事成本</span>'
      +'<span style="font-family:var(--mono);font-size:.82rem;font-weight:700;color:var(--red);">'+fv(cost)+'</span></div>';
    h+='</div>';

    // 簽收
    h+='<div style="padding:8px 18px;background:var(--gray-lt);border-top:1px solid var(--border);display:flex;justify-content:space-between;font-size:.65rem;color:var(--gray);">'
      +'<span>民國 '+rocY+' 年 '+mo+' 月 · '+emp.name+' 薪資單</span>'
      +'<span>簽收人/日期：____________</span></div>';
    h+='</div>';

    var slip=document.createElement('div');
    slip.innerHTML=h;
    wrap.appendChild(slip);
  }

  var footer=document.createElement('div');
  footer.innerHTML='<div class="slip-total">'
    +'<div class="tb-item"><div class="tb-lbl">全員薪資總計</div><div class="tb-val orange">'+fmt(grandNet)+'</div></div>'
    +'<div class="tb-item"><div class="tb-lbl">公司人事成本</div><div class="tb-val red">'+fmt(grandCost)+'</div></div>'
    +'<div class="tb-item"><div class="tb-lbl">員工人數</div><div class="tb-val">'+emps.length+' 人</div></div>'
    +'</div>';
  wrap.appendChild(footer);

  wrap.addEventListener('change',function(e){
    var t=e.target;
    if(!t.classList.contains('slip-inp')) return;
    var a=JSON.parse(localStorage.getItem(t.getAttribute('data-adjkey'))||'{}');
    a[t.getAttribute('data-key')]=+t.value;
    localStorage.setItem(t.getAttribute('data-adjkey'),JSON.stringify(a));
    _buildSlips(t.getAttribute('data-ym'),+t.getAttribute('data-rocy'),+t.getAttribute('data-mo'));
  });
  wrap.addEventListener('input',function(e){
    var t=e.target;
    if(!t.classList.contains('slip-inp')) return;
    var a=JSON.parse(localStorage.getItem(t.getAttribute('data-adjkey'))||'{}');
    a[t.getAttribute('data-key')]=+t.value;
    localStorage.setItem(t.getAttribute('data-adjkey'),JSON.stringify(a));
    clearTimeout(wrap._t);
    wrap._t=setTimeout(function(){
      _buildSlips(t.getAttribute('data-ym'),+t.getAttribute('data-rocy'),+t.getAttribute('data-mo'));
    },600);
  });
}


function lrow(label,val,cls){

}

// ── 員工設定 ──
function renderStaff(body){
  var today=new Date().toISOString().slice(0,10);

  // ── 本週班別（以週為單位，依班別排序）──
  var now=new Date();
  var mon=new Date(now);
  mon.setDate(now.getDate()-((now.getDay()+6)%7)); // 本週一
  var fri=new Date(mon); fri.setDate(mon.getDate()+4); // 本週五
  var monStr=mon.toISOString().slice(0,10);
  var ymStr=(mon.getFullYear()+''+pad(mon.getMonth()+1));

  // 取得本週班別設定（用 wksch）
  var wkData=getWkSch(ymStr);
  // 計算是第幾週
  var weeks=getWeeksOfMonth(mon.getFullYear(),mon.getMonth()+1);
  var curWkIdx=0;
  for(var wi=0;wi<weeks.length;wi++){
    if(mon>=weeks[wi].start&&mon<=weeks[wi].end){ curWkIdx=wi; break; }
  }

  function getEmpShift(emp){
    var key=emp.id+'_w'+curWkIdx;
    var sh=wkData[key];
    return sh||(emp.shift==='all'?'early':emp.shift)||'early';
  }

  // 依班別排序
  var shOrd={early:0,mid:1,late2:2};
  var sortedEmps=emps.slice().sort(function(a,b){
    return shOrd[getEmpShift(a)]-shOrd[getEmpShift(b)];
  });

  var fmt2=function(d){ return (d.getMonth()+1)+'/'+d.getDate(); };

  var html='<div class="sec-hd">員工管理</div>';

  // 本週輪班卡片
  html+='<div class="set-card" style="margin-bottom:20px;">'
    +'<div class="set-card-title">📅 本週班別（'+fmt2(mon)+' ～ '+fmt2(fri)+'）&nbsp;·&nbsp; 週一至週五</div>'
    +'<div style="font-size:.62rem;color:var(--gray);margin-bottom:12px;">設定每位老師本週班別，同班別自動排在一起</div>'
    +'<div style="overflow-x:auto;">'
    +'<table class="tbl" style="min-width:300px;"><thead><tr><th>姓名</th><th>本週班別</th><th>時段</th></tr></thead><tbody>';

  var lastSh2='';
  for(var si2=0;si2<sortedEmps.length;si2++){
    var emp2=sortedEmps[si2];
    var sh=getEmpShift(emp2);
    var c=SCH_COLORS[sh]||SCH_COLORS.early;
    if(lastSh2!==''&&sh!==lastSh2){
      html+='<tr><td colspan="3" style="padding:3px 10px;background:'+c.bg+';border:1px solid var(--border);">'
        +'<span style="font-size:.6rem;font-weight:700;color:'+c.tx+';">'+SCH_ICONS[sh]+' '+SCH_LABELS[sh]+'</span></td></tr>';
    }
    lastSh2=sh;
    html+='<tr>'
      +'<td style="font-weight:700;">'+emp2.name+'</td>'
      +'<td><div onclick="toggleStaffWkShift(\''+emp2.id+'\','+curWkIdx+',\''+ymStr+'\',\''+sh+'\')" '
      +'style="display:inline-flex;align-items:center;gap:5px;background:'+c.bg+';border:1.5px solid '+c.bd+';color:'+c.tx+';'
      +'border-radius:8px;padding:5px 12px;cursor:pointer;font-size:.75rem;font-weight:700;user-select:none;-webkit-user-select:none;">'
      +SCH_ICONS[sh]+' '+SCH_LABELS[sh]+'</div></td>'
      +'<td style="font-size:.68rem;color:var(--gray);font-family:var(--mono);">'+SCH_TIMES[sh]+'</td>'
      +'</tr>';
  }
  html+='</tbody></table></div></div>';

  // 新增員工按鈕
  html+='<div style="margin-bottom:14px;"><button class="set-btn" onclick="document.getElementById(\'me-hire\').value=\''+today+'\';document.getElementById(\'modal-emp\').classList.add(\'open\')">＋ 新增員工</button></div>';

  // 員工基本資料表（用 for 迴圈避免 iOS map 問題）
  var empRows='';
  for(var ei=0;ei<emps.length;ei++){
    var e=emps[ei];
    var opts='';
    var shList=['early','mid','late2','all'];
    for(var si=0;si<shList.length;si++){
      var s=shList[si];
      opts+='<option value="'+s+'"'+(e.shift===s?' selected':'')+'>'+SICONS[s]+' '+SNAMES[s]+'</option>';
    }
    empRows+='<tr>'
      +'<td><input class="ed-inp ed-nm" value="'+e.name+'" onchange="updateEmp(\''+e.id+'\',\'name\',this.value)"></td>'
      +'<td><select style="background:transparent;border:none;font-size:.72rem;color:var(--navy);outline:none;cursor:pointer;" onchange="updateEmp(\''+e.id+'\',\'shift\',this.value)">'+opts+'</select></td>'
      +'<td><input type="date" style="background:transparent;border:none;color:var(--gray);font-family:var(--mono);font-size:.7rem;outline:none;color-scheme:light;width:110px;" value="'+(e.hire||'')+'" onchange="updateEmp(\''+e.id+'\',\'hire\',this.value)"></td>'
      +'<td><input class="ed-inp" type="number" value="'+e.base+'" onchange="updateEmp(\''+e.id+'\',\'base\',+this.value)"></td>'
      +'<td><input class="ed-inp" type="number" value="'+(e.insured||0)+'" placeholder="自動" onchange="updateEmp(\''+e.id+'\',\'insured\',+this.value)"></td>'
      +'<td><input class="ed-inp" type="number" value="'+(e.dep_count||0)+'" min="0" max="3" step="1" onchange="updateEmp(\''+e.id+'\',\'dep_count\',+this.value)"></td>'
      +'<td><input class="ed-inp" type="number" value="'+(e.sup||0)+'" onchange="updateEmp(\''+e.id+'\',\'sup\',+this.value)"></td>'
      +'<td><input class="ed-inp" type="number" value="'+(e.admin||0)+'" onchange="updateEmp(\''+e.id+'\',\'admin\',+this.value)"></td>'
      +'<td><input class="ed-inp" type="number" value="'+(e.welfare||0)+'" onchange="updateEmp(\''+e.id+'\',\'welfare\',+this.value)"></td>'
      +'<td><input class="ed-inp" type="number" value="'+(e.hi_dep||0)+'" onchange="updateEmp(\''+e.id+'\',\'hi_dep\',+this.value)"></td>'
      +'<td style="font-family:var(--mono);color:var(--teal);font-weight:600;">'+annualEnt(e.hire)+'天</td>'
      +'<td><button onclick="delEmp(\''+e.id+'\')" style="background:transparent;border:none;color:var(--gray);cursor:pointer;font-size:.75rem;padding:2px 6px;">刪除</button></td>'
      +'</tr>';
  }

function getMonthWeeks(yr,mo){
  var weeks=[],days=new Date(yr,mo,0).getDate(),wkN=1,wkDates=[],wkStart=null;
  for(var d=1;d<=days;d++){
    var dt=new Date(yr,mo-1,d),dow=dt.getDay();
    if(dow===0||dow===6) continue;
    if(!wkStart) wkStart=dt;
    wkDates.push(dt);
    var next=new Date(yr,mo-1,d+1);
    if(d===days||next.getDay()===1||next.getDay()===0&&new Date(yr,mo-1,d+2).getDay()===1){
      var f=function(x){return (x.getMonth()+1)+'/'+pad(x.getDate());};
      var last=wkDates[wkDates.length-1];
      weeks.push({wk:wkN,range:f(wkStart)+'-'+f(last),dates:wkDates.slice()});
      wkN++;wkDates=[];wkStart=null;
    }
  }
  return weeks;
}

// 取得某月有幾週（週一為起點，週六日公休）
function getWeeksOfMonth(yr,mo){
  var weeks=[];
  var first=new Date(yr,mo-1,1);
  var last=new Date(yr,mo,0);
  // 找第一週：從1日到第一個週日
  var d=new Date(first);
  // 第一週從1號開始，到週五結束
  var wEnd=new Date(d);
  // 找本週的週五
  var dow=d.getDay(); // 0=日,1=一,...,6=六
  var daysToFri=dow===0?5:(dow<=5?5-dow:5+(7-dow));
  wEnd.setDate(d.getDate()+daysToFri);
  if(wEnd>last) wEnd=new Date(last);
  weeks.push({start:new Date(d),end:new Date(wEnd)});
  // 後續每週從週一到週五
  d.setDate(wEnd.getDate()+3); // 跳過週六週日到週一
  while(d<=last){
    var wS=new Date(d);
    var wE=new Date(d);
    wE.setDate(d.getDate()+4); // 週一+4=週五
    if(wE>last) wE=new Date(last);
    weeks.push({start:wS,end:wE});
    d.setDate(d.getDate()+7);
  }
  return weeks;
}

function msKey(yr,mo){return 'xb4_ms_'+yr+'-'+mo;}

function getManualSch(yr,mo){

}

function saveManualSch(yr,mo,data){

}

var _msPickerTarget=null;

function openMsPicker(el){
  _msPickerTarget=el;
  var cur=el.getAttribute('data-val')||'';
  var selected=cur?cur.split('、'):[];
  var fLbl={early:'早班',mid:'中班',trash:'倒垃圾',sweep:'晚值打掃',late:'晚值人員'};
  var usedMap={};
  var row=el.closest('.ms-row');
  if(row){
    row.querySelectorAll('[data-f]').forEach(function(p){
      if(p===el||p.tagName==='INPUT') return;
      var f=p.getAttribute('data-f');
      if(!fLbl[f]) return;
      var v=p.getAttribute('data-val')||'';
      v.split('、').forEach(function(nm){if(nm) usedMap[nm]=fLbl[f];});
    });
  }
  var overlay=document.getElementById('ms-picker-overlay');
  var list=document.getElementById('ms-picker-list');
  list.innerHTML='';
  for(var i=0;i<emps.length;i++){
    var nm=emps[i].name;
    var chk=selected.indexOf(nm)>=0?'checked':'';
    var used=usedMap[nm];
    var lbl=document.createElement('label');
    lbl.style.cssText='display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);font-size:.82rem;cursor:pointer;'+(used?'background:#fff8f0;':'');
    lbl.innerHTML='<input type="checkbox" value="'+nm+'" '+chk+' style="width:18px;height:18px;accent-color:var(--orange);"> '+nm
      +(used?'<span style="margin-left:auto;font-size:.65rem;color:var(--orange-dk);font-weight:600;white-space:nowrap;">已排'+used+'</span>':'');
    list.appendChild(lbl);
  }
  overlay.style.display='flex';
}

function closeMsPicker(save){
  var overlay=document.getElementById('ms-picker-overlay');
  if(save&&_msPickerTarget){
    var checks=document.querySelectorAll('#ms-picker-list input[type=checkbox]:checked');
    var names=[];
    for(var i=0;i<checks.length;i++) names.push(checks[i].value);
    var val=names.join('、');
    _msPickerTarget.setAttribute('data-val',val);
    _msPickerTarget.textContent=val||_msPickerTarget.getAttribute('data-ph');
    _msPickerTarget.style.color=val?'var(--navy)':'#aaa';
  }
  overlay.style.display='none';
  _msPickerTarget=null;
}

function makePicker(fieldName, val, placeholder){
  var btn=document.createElement('button');
  btn.setAttribute('data-f',fieldName);
  btn.setAttribute('data-val',val||'');
  btn.setAttribute('data-ph',placeholder);
  btn.type='button';
  btn.textContent=val||placeholder;
  btn.style.cssText='padding:5px 7px;border:1.5px solid var(--border2);border-radius:7px;font-size:.72rem;width:100%;box-sizing:border-box;text-align:left;background:#fff;cursor:pointer;color:'+(val?'var(--navy)':'#aaa')+';overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
  btn.addEventListener('click',function(){openMsPicker(btn);});
  return btn;
}

    +'<div><div style="font-size:1rem;font-weight:700;color:#2c3566;">小布迪音樂藝術托嬰中心</div>'
    +'<div style="font-size:.72rem;color:#888;">民國 '+rocY+' 年 '+mo+' 月 班表</div></div>'

  html+='<table style="width:100%;border-collapse:collapse;font-size:.68rem;">';

  for(var d=1;d<=days;d++){

    html+='<th style="border:1px solid #ddd;padding:4px 2px;text-align:center;min-width:28px;'+(isSun?'background:#ffeaea;':'')+'">'

    html+='<tr><td style="border:1px solid #ddd;padding:5px 8px;font-weight:600;background:#f9f9f9;white-space:nowrap;">'+emp.name+'</td>';
    for(var d=1;d<=days;d++){
      var date2=new Date(yr,mo-1,d);

      var ds=ym+pad(d);
      var key=emp.name+'_'+ds;

      html+='<td style="border:1px solid #ddd;padding:3px 2px;text-align:center;background:'+shiftColors[shift]+';color:'+(shift==='off'?'#bbb':'#333')+';font-weight:'+(shift==='off'?'400':'700')+';">'+SCH_LABELS[shift]+'</td>';
    }
    html+='</tr>';
  });

  // Count rows
  ['early','mid','late2'].forEach(function(sk){
    var labels={early:'早班',mid:'中班',late2:'晚班'};

        if(sh===sk) cnt++;
      });
      var target=SCH_TARGETS[sk];
      var warn=target&&cnt!==target;
      html+='<td style="border:1px solid #ddd;padding:3px 2px;text-align:center;font-size:.62rem;font-weight:700;'+(warn?'color:#e05555;background:#ffeaea;':'color:#333;')+'>'+cnt+'</td>';

  window.print();
  admBody.style.display=origDisplay;
  printDiv.style.display='none';
}

// ── 公開班表頁面 ──
function showHomeSch(){
  buildPublicSchedule();
  showPage('pg-schedule');
}

function buildPublicSchedule(){
  var n=new Date();
  var yr=n.getFullYear(),mo=n.getMonth()+1;
  // 優先顯示手動週班表
  var manualData=getManualSch(yr,mo);
  if(manualData&&manualData.weeks&&manualData.weeks.length){
    var wrap2=document.getElementById('pub-sch-wrap');
    if(!wrap2) return;
    wrap2.innerHTML=buildWeekSchHtml(yr,mo,manualData,false)+buildNotesHtml(false);
    return;
  }
  var ym=yr+''+pad(mo);
  var rocY=yr-1911;
  var weeks=getWeeksOfMonth(yr,mo);
  var data=getWkSch(ym);
  var fmt2=function(d){return (d.getMonth()+1)+'/'+d.getDate();};
  var wrap=document.getElementById('pub-sch-wrap');
  if(!wrap) return;

  function getShift(empId,wi){
    var key=empId+'_w'+wi;
    var sh=data[key];
    if(sh===undefined){
      var emp=emps.find(function(e){return e.id===empId;});
      sh=emp?(emp.shift==='all'?'early':emp.shift):'early';
    }
    return sh;
  }

  var shOrd={early:0,mid:1,late2:2};
  var sortedEmps=emps.slice().sort(function(a,b){
    return shOrd[getShift(a.id,0)]-shOrd[getShift(b.id,0)];
  });

  // 找本週是第幾週
  var mon=new Date(n);mon.setDate(n.getDate()-((n.getDay()+6)%7));
  var curWk=0;
  for(var wi=0;wi<weeks.length;wi++){
    if(mon>=weeks[wi].start&&mon<=weeks[wi].end){curWk=wi;break;}
  }

  var html='<div style="font-size:.65rem;font-weight:700;color:var(--orange);letter-spacing:.12em;margin-bottom:12px;">民國 '+rocY+' 年 '+mo+' 月 班表</div>';

  // 週次標題列
  html+='<div style="overflow-x:auto;margin-bottom:16px;">';
  html+='<table style="width:100%;border-collapse:collapse;font-size:.76rem;">';
  html+='<thead><tr><th style="padding:7px 12px;border:1px solid var(--border);background:var(--gray-lt);text-align:left;white-space:nowrap;">姓名</th>';
  for(var wi=0;wi<weeks.length;wi++){
    var isCur=(wi===curWk);
    html+='<th style="padding:7px 8px;border:1px solid var(--border);background:'+(isCur?'var(--orange-lt)':'var(--gray-lt)')+';text-align:center;min-width:80px;'+(isCur?'border-top:2.5px solid var(--orange);':'')+'">'
      +(isCur?'<div style="font-size:.55rem;color:var(--orange);font-weight:700;">本週</div>':'')
      +'<div style="font-size:.62rem;color:var(--gray);">第'+(wi+1)+'週</div>'
      +'<div style="font-size:.65rem;">'+fmt2(weeks[wi].start)+'～'+fmt2(weeks[wi].end)+'</div></th>';
  }
  html+='</tr></thead><tbody>';

  var lastSh='';
  for(var si=0;si<sortedEmps.length;si++){
    var emp=sortedEmps[si];
    var firstSh=getShift(emp.id,0);
    if(lastSh!==''&&firstSh!==lastSh){
      var c2=SCH_COLORS[firstSh];
      html+='<tr><td colspan="'+(weeks.length+1)+'" style="padding:2px 12px;background:'+c2.bg+';border:1px solid var(--border);">'
        +'<span style="font-size:.6rem;font-weight:700;color:'+c2.tx+';">'+SCH_ICONS[firstSh]+' '+SCH_LABELS[firstSh]+'</span></td></tr>';
    }
    lastSh=firstSh;
    html+='<tr><td style="padding:7px 12px;border:1px solid var(--border);font-weight:700;background:var(--gray-lt);white-space:nowrap;">'+emp.name+'</td>';
    for(var wi=0;wi<weeks.length;wi++){
      var sh=getShift(emp.id,wi);
      var c=SCH_COLORS[sh]||SCH_COLORS.early;
      var isCur2=(wi===curWk);
      html+='<td style="padding:5px 4px;border:1px solid var(--border);text-align:center;background:'+(isCur2?'var(--orange-lt)':c.bg)+';">'
        +'<span style="color:'+c.tx+';font-weight:700;font-size:.72rem;">'+SCH_ICONS[sh]+' '+SCH_LABELS[sh]+'</span></td>';
    }
    html+='</tr>';
  }
  html+='</tbody></table></div>';

  // 本週各班人員摘要
  html+='<div style="font-size:.65rem;font-weight:700;color:var(--gray);letter-spacing:.12em;margin-bottom:8px;">本週班別（第'+(curWk+1)+'週 '+fmt2(weeks[curWk].start)+'～'+fmt2(weeks[curWk].end)+'）</div>';
  html+='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">';
  var shiftList=['early','mid','late2'];
  for(var si2=0;si2<shiftList.length;si2++){
    var sh2=shiftList[si2];
    var c3=SCH_COLORS[sh2];
    var names=[];
    for(var ei=0;ei<emps.length;ei++){
      if(getShift(emps[ei].id,curWk)===sh2) names.push(emps[ei].name);
    }
    html+='<div style="background:'+c3.bg+';border:1.5px solid '+c3.bd+';border-radius:10px;padding:10px;">'
      +'<div style="font-size:.65rem;font-weight:700;color:'+c3.tx+';margin-bottom:6px;">'+SCH_ICONS[sh2]+' '+SCH_LABELS[sh2]+'</div>'
      +'<div style="font-size:.62rem;color:var(--navy);">'+(names.length?names.join('<br>'):'—')+'</div>'
      +'<div style="font-size:.58rem;color:var(--gray);margin-top:4px;font-family:var(--mono);">'+SCH_TIMES[sh2]+'</div>'
      +'</div>';
  }
  html+='</div>';
  wrap.innerHTML=html;
  wrap.innerHTML+=buildNotesHtml(false);
}

function onFbReady(){
  // Firebase 在 init() 之後才就緒時呼叫
  var dot=document.getElementById('fb-dot'),st=document.getElementById('fb-status');
  if(dot)dot.className='fb-dot ok';
  if(st)st.textContent='已連線 Firebase';
}

function init(){
  // 等待 Firebase 就緒（最多3秒）
  var w=0;
  function waitFb(){
    if(window._fb&&window._fb.ready){
      startApp();
    } else if(w<500){
      w+=100;
      setTimeout(waitFb,100);
    } else {
      startApp();
    }
  }
  function startApp(){
    var dot=document.getElementById('fb-dot'),st=document.getElementById('fb-status');
    if(window._fb&&window._fb.ready){
      if(dot)dot.className='fb-dot ok';
      if(st)st.textContent='已連線 Firebase';
      fbGet('employees').then(function(data){
        if(data){emps=Array.isArray(data)?data:Object.keys(data).map(function(k){return data[k];});saveEmps();}
        return fbGet('shift_times');
      }).then(function(st2){
        if(st2){STIMES=st2;localStorage.setItem('xb_stimes',JSON.stringify(st2));}
        showPage('pg-select');
        renderSelect();
      }).catch(function(){
        showPage('pg-select');
        renderSelect();
      });
    } else {
      if(st)st.textContent='離線模式';
      showPage('pg-select');
      renderSelect();
    }
  }
  waitFb();
}
